name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 .

  backend-test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.2
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock.txt

      # Hash-locked so nothing enters the job without a checksum, and wheels only:
      # a source distribution runs its build script at install time.
      # Regenerate the lock with the command in its header after editing requirements.txt.
      - name: Install dependencies
        run: "pip install --require-hashes --only-binary :all: -r requirements.lock.txt"

      - name: Run tests with coverage
        run: python -m pytest tests/ --cov=. --cov-report=term --cov-fail-under=80
        env:
          MONGODB_URL: mongodb://localhost:27017/blogging

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client
